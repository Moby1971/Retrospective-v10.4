default:
  # Number of iterations to use for the RIM network
  niteration : 7
  # Maximum number of worker processes for preparing data batches.
  # Automatically reduced to the number of cpu cores on the machine. 0 = load in the main process.
  num-workers : 12
  # Device to use: cuda, mps, cpu, or auto (picks the best available on this machine)
  device : mps
  # Image or volume
  volume: True
  kernel: 333 None None
  batch-size: 1
